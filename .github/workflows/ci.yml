name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sdes
          POSTGRES_USER: sdes_owner
          POSTGRES_PASSWORD: ci-owner
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U sdes_owner -d sdes" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_OWNER_URL: postgresql://sdes_owner:ci-owner@127.0.0.1:5433/sdes
      POSTGRES_OWNER_PASSWORD: ci-owner
      POSTGRES_APP_PASSWORD: ci-app
      REDIS_PASSWORD: ""
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      ERP_SECRET_KEY: ci-only-erp-secret-key-not-used-anywhere-else
      COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ช่องโหว่ระดับ critical ใน dependency ที่ใช้งานจริงทำให้ CI ไม่ผ่าน (spec platform-security)
      - run: pnpm test:scripts
      - run: pnpm audit:gate
      - run: pnpm --filter @sdes/db migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
