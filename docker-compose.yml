# Dev stack — รันด้วย: wsl docker compose up -d   (ค่าใน .env)
name: sdes

x-app-env: &app-env
  DATABASE_URL: postgresql://sdes_app:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  DATABASE_OWNER_URL: postgresql://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET}
  S3_REGION: ${S3_REGION}
  S3_SSE: ${S3_SSE}
  CLAMD_HOST: clamav
  CLAMD_PORT: "3310"
  JWT_SECRET: ${JWT_SECRET}
  # api เข้ารหัส/ทดสอบ, worker ถอดรหัสเพื่อส่งเข้า ERP
  ERP_SECRET_KEY: ${ERP_SECRET_KEY:-}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  seaweedfs:
    restart: unless-stopped
    image: chrislusf/seaweedfs:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"sdes","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=0 -master.volumeSizeLimitMB=1024
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["${S3_HOST_PORT:-8333}:8333"]
    volumes: [s3data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30

  clamav:
    restart: unless-stopped
    image: clamav/clamav:stable
    ports: ["${CLAMD_HOST_PORT:-3310}:3310"]
    volumes: [clamdb:/var/lib/clamav]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 120s

  api:
    restart: unless-stopped
    build: { context: ., args: { APP: api } }
    environment:
      <<: *app-env
      PORT: "3000"
    ports: ["${API_PORT:-3000}:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
      clamav: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    restart: unless-stopped
    build: { context: ., args: { APP: worker } }
    environment:
      <<: *app-env
      # การอ่านเอกสาร (design D1) — API key อยู่เฉพาะ worker ไม่ส่งให้ api
      EXTRACTION_PROVIDER: ${EXTRACTION_PROVIDER:-fake}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # ว่าง = รุ่นเริ่มต้นของ provider (claude-opus-5-5 / gemini-3.8-flash)
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-}
      EXTRACTION_EFFORT: ${EXTRACTION_EFFORT:-low}
      EXTRACTION_TIMEOUT_MS: ${EXTRACTION_TIMEOUT_MS:-120000}
      EXTRACTION_FIXTURE_DIR: /fixtures
    volumes:
      # เฉลยของ fixture provider (ชุดทดสอบ) — อ่านอย่างเดียว
      - ${EXTRACTION_FIXTURE_HOST_DIR:-./.fixtures}:/fixtures:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  redisdata:
  s3data:
  clamdb:
